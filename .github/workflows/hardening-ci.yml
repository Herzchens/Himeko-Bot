name: Hardening CI

on:
  push:
    branches:
      - fix/runtime-multiguild-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${{ matrix.toolchain }}" --component rustfmt --component clippy
          rustup default "${{ matrix.toolchain }}"
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (debug)
        run: cargo test --all-targets

      - name: Tests (release)
        run: cargo test --release --all-targets

      - name: Diff hygiene
        run: git diff --check origin/main HEAD
