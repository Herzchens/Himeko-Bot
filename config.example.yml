bot:
  # Token của bot (Lấy từ Discord Developer Portal)
  token: "YOUR_DISCORD_BOT_TOKEN"

  # Application ID của bot
  application_id: 1234567890123456789

permissions:
  # ID tài khoản Discord của BẠN (vào Discord, chuột phải vào avatar của bạn -> Copy User ID)
  owner_id: 111222333444555

  # Danh sách ID những người được phép xài bot (có thể để trống)
  allowed_users: []

tts:
  # Chọn engine: "gtts" | "msedge" | "supertonic" | "openai" | "vieneu"
  provider: "msedge"

  # Giọng mặc định khi bot khởi động: "female" hoặc "male"
  default_gender: "female"

  # Tốc độ đọc: 0 (bình thường), 20 (nhanh hơn 20%), -20 (chậm hơn 20%). gTTS yêu cầu 0.
  rate: 0

  # Cao độ giọng: 0 (bình thường), đơn vị Hz. gTTS yêu cầu 0.
  pitch: 0

  # Giới hạn ký tự hiển thị (extended grapheme cluster) của một message sau filter/normalize.
  # Vượt giới hạn thì reject nguyên message, không truncate. 0 = không giới hạn.
  # Provider vẫn tự chia nhỏ input đã được chấp nhận theo giới hạn an toàn riêng (ví dụ gTTS/Edge).
  max_chars: 0

  # Định dạng audio (Không nên đổi nếu không hiểu rõ)
  audio_format: "audio-24khz-48kbitrate-mono-mp3"

  # Cấu hình giọng đọc Edge TTS
  msedge:
    - female: "vi-VN-HoaiMyNeural"
    - male: "vi-VN-NamMinhNeural"
    - en_female: "en-US-JennyNeural"
    - en_male: "en-US-GuyNeural"

  # --- Supertonic config (TTS local server) ---
  # Cần chạy: pip install 'supertonic[serve]' && supertonic serve --port 7788
  supertonic:
    - server_url: "http://127.0.0.1:7788"
    - female: "F2"
    - male: "M1"
    - lang: "vi"
    - steps: 5
    - speed: 1.05
    - autostart: false # Tự động chạy server supertonic khi bot chạy (true | false)

  # --- OpenAI-compatible config (e.g. VietTTS, F5-TTS, or official OpenAI API) ---
  openai:
    - api_url: "http://127.0.0.1:8000/v1"
    - api_key: ""
    - female: "vi-female"
    - male: "vi-male"
    - model: "tts-1"

  # --- VieNeu-TTS config (TTS local CPU-optimized server) ---
  # Cài dependency được Himeko hỗ trợ: pip install -r requirements-vieneu.txt
  vieneu:
    - server_url: "http://127.0.0.1:7799"
    - female: "Ly" # Giọng nữ. Cho standard/gpu mặc định dùng "Ly" (Trúc Ly). Cho turbo/turbo_gpu hãy dùng "Bích Ngọc" hoặc "Thục Đoan". (Hoặc path âm thanh wav/mp3 để clone)
    - male: "Binh" # Giọng nam. Cho standard/gpu mặc định dùng "Binh" (Thanh Bình). Cho turbo/turbo_gpu hãy dùng "Phạm Tuyên" hoặc "Xuân Vĩnh"
    - speed: 1.0
    - autostart: false # Tự động chạy server vieneu khi bot chạy (true | false)
    - mode: "turbo" # Chế độ chạy: "turbo" (CPU nhanh) | "turbo_gpu" (GPU Nvidia nhanh) | "standard" (GGUF CPU/GPU chất lượng cao) | "fast" (LMDeploy GPU chất lượng cao + siêu nhanh, cần pip install lmdeploy)
    - temperature: 0.3 # Độ ngẫu nhiên/biến đổi tông giọng (0.3 = ổn định, 0.0 = ngẫu nhiên/tự nhiên hơn)

abbreviations:
  # Từ viết tắt:
  ko: "không"
  kh: "không"
  k: "không"
  dc: "được"
  đc: "được"
  j: "gì"
  vs: "với"
  ms: "mới"
  r: "rồi"
  ròi: "rồi"
  thoi: "thôi"
  rứa: "thế"
  z: "vậy"
  zậy: "vậy"
  cx: "cũng"
  ntn: "như thế nào"
  nnao: "như nào"
  s: "sao"
  sao: "sao"
  sv: "sinh viên"
  gth: "giải thích"
  h: "giờ"
  nhìu: "nhiều"
  "vkl": "vãi lồn"
  "dm": "địt mẹ"
