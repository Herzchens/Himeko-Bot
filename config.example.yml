ai:
  enabled: true
  provider: "gemini" # hoặc "groq"
  api_key: "YOUR_GOOGLE_AI_STUDIO_API_KEY"
  model: "gemini-flash-latest"
  google_search: true
  groq_api_key: "YOUR_GROQ_API_KEY"
  groq_model: "llama-3.3-70b-versatile"
  custom_answers:
    "Ai tạo ra bạn? Bạn của ai? Chủ của bạn là ai? Ai viết ra bạn?": "Tôi là con của Herzchen!"
    "Minh có béo không": "Béo chứ, béo vãi lồn"

rank:
  enabled: true

  # Cấu hình legacy một server. Vẫn được hỗ trợ để database.yml cũ có thể migrate an toàn.
  guild_id: 123456789012345678
  target_role_id: 223456789012345678
  leaderboard_channel_id: 323456789012345678
  stars_per_rank: 3
  ranks:
    - "CHÓ NÁT"
    - "CHÓ RÁCH TẬP SỰ"
    - "CHÓ RÁCH"
    - "CHÓ ĐIÊN"
    - "CHÓ TRÙM"

  # Multi-server: thêm từng guild vào map này. ID phải đặt trong dấu nháy.
  # Nếu cùng ID xuất hiện ở đây và guild_id legacy phía trên, cấu hình trong guilds được ưu tiên.
